name: Java 8 JAR build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test on Java 8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Show build environment
        run: |
          java -version
          mvn -version
      - name: Build and verify AdvancedCore
        run: mvn -B -ntp -f AdvancedCore/pom.xml -Dmaven.resolver.transport=wagon clean verify
      - name: Upload AdvancedCore JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AdvancedCore-1.8-${{ github.sha }}
          path: AdvancedCore/target/AdvancedCore.jar
          if-no-files-found: error
          retention-days: 14
